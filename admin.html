<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>User Management</title>

<link rel="stylesheet" href="./auth.css">

<style>
body{
    background:#f6f8fb;
    font-family:Segoe UI,sans-serif;
    padding:30px;
}

.card{
    background:#fff;
    border-radius:12px;
    padding:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:left;
}

button{
    padding:6px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.approve{
    background:#28a745;
    color:white;
}

.reject{
    background:#dc3545;
    color:white;
}

.disable{
    background:#6c757d;
    color:white;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase.js"></script>
<script defer src="./admin.js"></script>
</head>

<body>

<div class="card">

<h2>User Management</h2>

<table>

<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Department</th>
<th>Status</th>
<th>Role</th>
<th>Action</th>
</tr>
</thead>

<tbody id="user-list"></tbody>

</table>

</div>

</body>
</html>
